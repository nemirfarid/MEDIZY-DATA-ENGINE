name: Android APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
      - name: Pin Flutter Gradle runtime to Java 17
        run: flutter config --jdk-dir="$JAVA_HOME"
      - name: Restore Android project scaffolding
        run: flutter create --platforms android --org dz.medizy --project-name medizy_mobile mobile
      - name: Enable network access for directory map tiles
        working-directory: mobile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          marker='<manifest '
          if 'android.permission.INTERNET' not in s:
              s=s.replace('<application', '  <uses-permission android:name="android.permission.INTERNET" />\n  <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n  <application', 1)
          p.write_text(s)
          PY
      - name: Restore committed Flutter app files
        run: git checkout $GITHUB_SHA -- mobile/pubspec.yaml mobile/lib/main.dart mobile/analysis_options.yaml mobile/test/widget_test.dart
      - name: Install MEDIZY launcher icon and splash (no Pillow dependency)
        working-directory: mobile
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/mipmap
          cat > android/app/src/main/res/drawable/ic_medizy_foreground.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="512" android:viewportHeight="512">
            <path android:fillColor="#06B6D4" android:pathData="M256,42 C145,42 64,125 64,230 C64,340 256,470 256,470 C256,470 448,340 448,230 C448,125 367,42 256,42 Z"/>
            <path android:fillColor="#0B1329" android:pathData="M256,132 C198,132 152,178 152,236 C152,294 198,340 256,340 C314,340 360,294 360,236 C360,178 314,132 256,132 Z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M182,252 L216,192 L256,238 L296,192 L330,252 L306,266 L290,234 L256,286 L222,234 L206,266 Z"/>
          </vector>
          EOF
          cat > android/app/src/main/res/drawable/ic_medizy_background.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><solid android:color="#0B1329"/></shape>
          EOF
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/ic_medizy_background"/>
            <foreground android:drawable="@drawable/ic_medizy_foreground"/>
          </adaptive-icon>
          EOF
          cat > android/app/src/main/res/mipmap/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="48dp" android:height="48dp" android:viewportWidth="512" android:viewportHeight="512">
            <path android:fillColor="#0B1329" android:pathData="M0,0 H512 V512 H0 Z"/>
            <path android:fillColor="#06B6D4" android:pathData="M256,42 C145,42 64,125 64,230 C64,340 256,470 256,470 C256,470 448,340 448,230 C448,125 367,42 256,42 Z"/>
            <path android:fillColor="#0B1329" android:pathData="M256,132 C198,132 152,178 152,236 C152,294 198,340 256,340 C314,340 360,294 360,236 C360,178 314,132 256,132 Z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M182,252 L216,192 L256,238 L296,192 L330,252 L306,266 L290,234 L256,286 L222,234 L206,266 Z"/>
          </vector>
          EOF
          cat > android/app/src/main/res/drawable/launch_background.xml <<'EOF'
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
            <item><shape android:shape="rectangle"><solid android:color="#0B1329"/></shape></item>
            <item android:gravity="center" android:width="144dp" android:height="144dp" android:drawable="@drawable/ic_medizy_foreground"/>
          </layer-list>
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          if 'android:roundIcon=' not in s:
              s=s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher"')
          p.write_text(s)
          PY
      - name: Bundle compressed healthcare directory
        run: mkdir -p mobile/assets && cp mobile/Annuaire_Sante_Algerie_UNIQUE_MASTER_PREMIUM.csv.gz mobile/assets/Annuaire_Sante_Algerie_UNIQUE_MASTER_PREMIUM.csv.gz
      - name: Verify healthcare dataset before packaging
        shell: bash
        run: |
          gzip -t mobile/Annuaire_Sante_Algerie_UNIQUE_MASTER_PREMIUM.csv.gz
          echo "Compressed dataset size: $(stat -c%s mobile/Annuaire_Sante_Algerie_UNIQUE_MASTER_PREMIUM.csv.gz) bytes"
          echo "CSV records (including header): $(gzip -dc mobile/Annuaire_Sante_Algerie_UNIQUE_MASTER_PREMIUM.csv.gz | wc -l)"
          echo "CSV header:"
          gzip -dc mobile/Annuaire_Sante_Algerie_UNIQUE_MASTER_PREMIUM.csv.gz | head -n 1
      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze and test
        working-directory: mobile
        run: flutter analyze --no-fatal-warnings --no-fatal-infos && flutter test
      - name: Build APK
        working-directory: mobile
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: medizy-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

# Rebuild trigger requested by repository owner.
