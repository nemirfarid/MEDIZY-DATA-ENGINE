name: Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
      - name: Pin Flutter Gradle runtime to Java 17
        run: flutter config --jdk-dir="$JAVA_HOME"
      - name: Restore Android project scaffolding
        run: flutter create --platforms android --org dz.medizy --project-name medizy_mobile mobile
      - name: Restore committed Flutter app files
        run: git checkout $GITHUB_SHA -- mobile/pubspec.yaml mobile/lib/main.dart mobile/analysis_options.yaml mobile/test/widget_test.dart
      - name: Install MEDIZY Android launcher and splash branding
        working-directory: mobile
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/mipmap
          cat > android/app/src/main/res/drawable/ic_medizy_mark.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#0645B8" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M54,18 L82,29 L80,57 C78,73 67,84 54,91 C41,84 30,73 28,57 L26,29 Z"/>
            <path android:fillColor="#159C98" android:pathData="M49,39h10v10h10v10h-10v10h-10v-10h-10v-10h10z"/>
            <path android:fillColor="#E53935" android:pathData="M78,72a11,11 0,1 0,22 0a11,11 0,1 0,-22 0"/>
            <path android:fillColor="#FFFFFF" android:pathData="M89,78 C84,74 82,72 84,69 C86,66 89,68 89,70 C91,67 95,67 97,70 C99,73 95,76 89,78z"/>
          </vector>
          EOF
          cp android/app/src/main/res/drawable/ic_medizy_mark.xml android/app/src/main/res/mipmap/ic_launcher.xml
          cat > android/app/src/main/res/drawable/launch_background.xml <<'EOF'
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
            <item><shape android:shape="rectangle"><solid android:color="#F4FAF9"/></shape></item>
            <item android:gravity="center" android:width="108dp" android:height="108dp" android:drawable="@drawable/ic_medizy_mark"/>
          </layer-list>
          EOF
          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@mipmap/ic_launcher"#' android/app/src/main/AndroidManifest.xml
      - name: Bundle compressed healthcare directory
        run: mkdir -p mobile/assets && cp mobile/Annuaire_Sante_Algerie_UNIQUE_MASTER_PREMIUM.csv.gz mobile/assets/Annuaire_Sante_Algerie_UNIQUE_MASTER_PREMIUM.csv.gz
      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze and test
        working-directory: mobile
        run: flutter analyze --no-fatal-warnings --no-fatal-infos && flutter test
      - name: Build APK
        working-directory: mobile
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: medizy-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
