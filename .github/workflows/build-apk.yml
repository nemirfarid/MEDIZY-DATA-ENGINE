name: Build MEDIZY APK Release

on:
  workflow_dispatch:
  push:
    branches: [main, fix/android-build]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'

env:
  JAVA_VERSION: '17'
  FLUTTER_VERSION: '3.50.0'
  FLUTTER_CHANNEL: 'stable'

jobs:
  build-apk:
    name: Build Android APK Release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}

      - name: Verify Flutter installation
        run: |
          flutter --version
          flutter doctor -v

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Verify pubspec.lock is up to date
        run: |
          if [ -n "$(git status --porcelain pubspec.lock)" ]; then
            echo "pubspec.lock is not up to date"
            git diff pubspec.lock
            exit 1
          fi

      - name: Configure Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build APK Release
        run: |
          flutter build apk --release --verbose
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

      - name: Verify APK
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found at $APK_PATH"
            ls -la build/app/outputs/
            exit 1
          fi
          echo "APK found: $APK_PATH"
          echo "APK size: $(du -h $APK_PATH | cut -f1)"
          echo "APK SHA256: $(sha256sum $APK_PATH | cut -d' ' -f1)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: medizy-apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          compression-level: 6

      - name: Upload build info
        run: |
          cat > build-info.txt <<EOF
          Flutter Version: $(flutter --version | head -1)
          Dart Version: $(dart --version)
          Java Version: $(java -version 2>&1 | head -1)
          Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}
          APK Path: build/app/outputs/flutter-apk/app-release.apk
          APK Size: $(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1)
          APK SHA256: $(sha256sum build/app/outputs/flutter-apk/app-release.apk | cut -d' ' -f1)
          EOF
          cat build-info.txt

      - name: Upload build info artifact
        uses: actions/upload-artifact@v4
        with:
          name: medizy-build-info
          path: build-info.txt
          retention-days: 30