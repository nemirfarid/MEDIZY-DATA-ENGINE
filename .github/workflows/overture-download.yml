name: Download Overture Algeria Places
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Overture downloader
        run: python -m pip install overturemaps
      - name: Download Algeria Places GeoJSON
        run: overturemaps download --bbox=-8.67,18.96,12.00,37.12 -f geojson --type=place -o overture_algeria_places.geojson
      - name: Upload source extract for local filtering and QA
        uses: actions/upload-artifact@v4
        with:
          name: medizy-overture-algeria-${{ github.run_number }}
          path: overture_algeria_places.geojson
          if-no-files-found: error
          retention-days: 7
