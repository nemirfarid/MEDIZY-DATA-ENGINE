name: Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
      - name: Pin Flutter Gradle runtime to Java 17
        run: flutter config --jdk-dir="$JAVA_HOME"
      - name: Restore Android project scaffolding
        run: flutter create --platforms android --org dz.medizy --project-name medizy_mobile mobile
      - name: Restore committed Flutter app files
        run: git checkout $GITHUB_SHA -- mobile/pubspec.yaml mobile/lib/main.dart mobile/analysis_options.yaml mobile/test/widget_test.dart
      - name: Install MEDIZY Android launcher and splash branding
        working-directory: mobile
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/mipmap
          cat > android/app/src/main/res/drawable/ic_medizy_mark.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="512" android:viewportHeight="512">
            <path android:fillColor="#0B1329" android:pathData="M0,0h512v512h-512z"/>
            <path android:fillColor="#06B6D4" android:pathData="M256,70 C170,70 100,140 100,228 C100,332 256,445 256,445 C256,445 412,332 412,228 C412,140 342,70 256,70 Z"/>
            <path android:fillColor="#0B1329" android:pathData="M256,130 C203,130 160,173 160,225 C160,278 203,321 256,321 C309,321 352,278 352,225 C352,173 309,130 256,130 Z"/>
            <path android:fillColor="#38BDF8" android:pathData="M185,244 L220,184 L256,230 L292,184 L327,244 L307,256 L292,225 L256,274 L220,225 L205,256 Z"/>
            <circle android:fillColor="#FFFFFF" android:cx="256" android:cy="286" android:radius="9"/>
          </vector>
          EOFOF
          cp android/app/src/main/res/drawable/ic_medizy_mark.xml android/app/src/main/res/mipmap/ic_launcher.xml
          cat > android/app/src/main/res/drawable/launch_background.xml <<'EOF'
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
            <item><shape android:shape="rectangle"><solid android:color="#F4FAF9"/></shape></item>
            <item android:gravity="center" android:width="108dp" android:height="108dp" android:drawable="@drawable/ic_medizy_mark"/>
          </layer-list>
          EOF
          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@mipmap/ic_launcher"#' android/app/src/main/AndroidManifest.xml
      - name: Bundle compressed healthcare directory
        run: mkdir -p mobile/assets && cp mobile/Annuaire_Sante_Algerie_UNIQUE_MASTER_PREMIUM.csv.gz mobile/assets/Annuaire_Sante_Algerie_UNIQUE_MASTER_PREMIUM.csv.gz
      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze and test
        working-directory: mobile
        run: flutter analyze --no-fatal-warnings --no-fatal-infos && flutter test
      - name: Build APK
        working-directory: mobile
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: medizy-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
