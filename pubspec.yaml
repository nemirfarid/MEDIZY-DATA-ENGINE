name: sante_dz_medizy
description: "Application mobile Santé DZ / Medizy - Programme National Sanitaire Algérie (Offline-First)"
publish_to: 'none'
version: 1.0.19+19

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  crypto: ^3.0.3
  path: ^1.9.0
  path_provider: ^2.1.2
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  url_launcher: ^6.2.5
  share_plus: ^9.0.0
  collection: ^1.18.0
  geolocator: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.24.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/sante_dz_bundled.db
    - assets/data/sante_dz_db.json.gz
    - assets/data/medizy_wilayas_index.json
    - assets/data/medizy_categories_index.json
